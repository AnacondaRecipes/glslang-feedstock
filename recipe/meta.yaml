{% set name = "glslang" %}
{% set version = "16.6.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/KhronosGroup/{{ name }}/archive/{{ version }}.tar.gz
  sha256: 9c09b901149c729df745057dafa815278aaa101b84d2b6e14f16a42de52f97f2

build:
  # python is only a build tool (intrinsic/header generation), not a runtime
  # dependency; restrict to a single variant instead of building per python.
  skip: true  # [py!=312]
  number: 0
  run_exports:
    # They seem to use so names with the major version, so lets stick with that
    - {{ pin_subpackage('glslang', 'x') }}
  ignore_run_exports_from:
    - python

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja-base
    # Needed as a build tool
    - python 3.12
  host:
    # upstream known_good.json references SPIRV-Tools v2026.4 (not yet in the
    # channel); 2026.1 is linked via ALLOW_EXTERNAL_SPIRV_TOOLS
    - spirv-tools 2026.1

test:
  # Upstream gtests are not run here: they need the External/googletest and
  # External/spirv-tools source trees plus the Test/ fixtures, which are not
  # part of the release tarball. Smoke tests cover the installed binaries/libs.
  commands:
    - glslang --version
    - glslangValidator --version
    - test -f ${PREFIX}/lib/libglslang${SHLIB_EXT}             # [unix]
    - test -f ${PREFIX}/lib/libSPIRV${SHLIB_EXT}               # [unix]
    # hmaarrfk: 2023/06
    # I'm not successful at building shared libraries on windows
    - if not exist %PREFIX%\\Library\\lib\\glslang.lib exit 1  # [win]
    - if not exist %PREFIX%\\Library\\lib\\SPIRV.lib   exit 1  # [win]
    # - if not exist %PREFIX%\\Library\\bin\\glslang.dll exit 1  # [win]
    # - if not exist %PREFIX%\\Library\\bin\\SPIRV.dll   exit 1  # [win]

about:
  home: https://github.com/KhronosGroup/glslang
  dev_url: https://github.com/KhronosGroup/glslang
  doc_url: https://github.com/KhronosGroup/glslang
  summary: Glslang Components and Status
  description: |
    Khronos-reference front end for GLSL/ESSL, partial front end for HLSL, and a SPIR-V generator.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - hmaarrfk
